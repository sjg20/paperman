name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  # CI measures the test coverage, so the site is rebuilt to show it
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx
        run: pip install -r doc/requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build -b html doc _site/docs

      - name: Copy landing page and images
        run: |
          cp site/index.html _site/
          mkdir -p _site/images
          cp doc/*.jpeg doc/*.png _site/images/

      - name: Add the latest coverage report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --workflow ci.yml --branch master \
                --event push --limit 10 --json databaseId \
                --jq '.[].databaseId' || true); do
            if gh run download "$run" -n coverage-report -D _site/coverage; then
              break
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
