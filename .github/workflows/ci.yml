name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  qt:
    name: Qt desktop app + server + C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5/C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            qt5-qmake qtbase5-dev qtbase5-dev-tools libqt5sql5-sqlite \
            libpoppler-qt5-dev libpodofo-dev \
            libtiff-dev libsane-dev libjpeg-dev zlib1g-dev \
            imagemagick tesseract-ocr tesseract-ocr-eng libimage-exiftool-perl \
            python3-reportlab python3-pil python3-numpy \
            poppler-utils

      - name: Build desktop app
        run: qmake paperman.pro CONFIG+=test && make -f Makefile -j$(nproc)

      - name: Build server
        run: |
          qmake paperman-server.pro -o Makefile.server
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -f Makefile.server -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        run: QT_QPA_PLATFORM=offscreen ./paperman -t

      - name: Run page-fetch integration test
        run: scripts/test_page_fetch.sh

      - name: Run parallel conversion test
        run: scripts/test_parallel.sh

  qt6:
    name: Qt6 desktop app + server + C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6/C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            qmake6 qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite \
            libpoppler-qt6-dev libpodofo-dev \
            qt6-scxml-dev libqt6statemachine6 \
            libtiff-dev libsane-dev libjpeg-dev zlib1g-dev \
            imagemagick tesseract-ocr tesseract-ocr-eng libimage-exiftool-perl \
            python3-reportlab python3-pil python3-numpy \
            poppler-utils

      - name: Build desktop app
        run: qmake6 paperman.pro CONFIG+=test -o Makefile.qt6 && make -f Makefile.qt6 -j$(nproc)

      - name: Build server
        run: |
          qmake6 paperman-server.pro -o server.mk
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -f server.mk -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        run: QT_QPA_PLATFORM=offscreen ./paperman -t

      - name: Run page-fetch integration test
        run: scripts/test_page_fetch.sh

      - name: Run parallel conversion test
        run: scripts/test_parallel.sh

  windows:
    name: Windows (MSYS2 MinGW64, Qt6) desktop app + server + C++ tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-scxml
            mingw-w64-x86_64-poppler-qt6
            mingw-w64-x86_64-podofo
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-ghostscript
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-tesseract-data-eng
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-reportlab
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-numpy

      - name: Build desktop app
        run: qmake6 paperman.pro CONFIG+=test -o Makefile.win && make -k -f Makefile.win -j$(nproc)

      - name: Build server
        run: |
          qmake6 paperman-server.pro -o server.mk
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -k -f server.mk -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        # fail a hung test quickly rather than after QtTest's five minutes
        run: QT_QPA_PLATFORM=offscreen QTEST_FUNCTION_TIMEOUT=60000 ./paperman.exe -t

  flutter:
    name: Flutter app + widget tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable

      - name: Generate demo assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-reportlab python3-pil python3-numpy poppler-utils
          python3 app/tools/gen_demo_assets.py

      - name: Analyse
        run: cd app && flutter analyze

      - name: Run widget tests
        run: cd app && flutter test

      - name: Set up dart-defines
        run: |
          APP_VERSION=$(sed -n 's/.*CONFIG_version_str "\(.*\)"/\1.0/p' config.h)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "{\"BUILD_DATE\":\"$(date '+%a %d %b %H:%M:%S %Z %Y')\"}" > app/dart-defines.json

      - name: Build release APK
        run: |
          cd app && flutter build apk \
            --build-name="$APP_VERSION" \
            --dart-define-from-file=dart-defines.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Linux desktop app
        run: |
          cd app && flutter build linux \
            --build-name="$APP_VERSION" \
            --dart-define-from-file=dart-defines.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperman-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
