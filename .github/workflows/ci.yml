name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  qt:
    name: Qt desktop app + server + C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5/C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            qt5-qmake qtbase5-dev qtbase5-dev-tools libqt5sql5-sqlite libqt5svg5-dev \
            libpoppler-qt5-dev libpodofo-dev \
            libtiff-dev libsane-dev libjpeg-dev zlib1g-dev \
            imagemagick tesseract-ocr tesseract-ocr-eng libimage-exiftool-perl \
            python3-reportlab python3-pil python3-numpy \
            poppler-utils

      - name: Build desktop app
        run: qmake paperman.pro CONFIG+=test && make -f Makefile -j$(nproc)

      - name: Build server
        run: |
          qmake paperman-server.pro -o Makefile.server
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -f Makefile.server -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        run: QT_QPA_PLATFORM=offscreen ./paperman -t

      - name: Run page-fetch integration test
        run: scripts/test_page_fetch.sh

      - name: Run server smoke test
        run: scripts/test_server_smoke.sh

      - name: Run parallel conversion test
        run: scripts/test_parallel.sh

  qt6:
    name: Qt6 desktop app + server + C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6/C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            qmake6 qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite \
            libpoppler-qt6-dev libpodofo-dev \
            qt6-scxml-dev libqt6statemachine6 qt6-svg-dev \
            libtiff-dev libsane-dev libjpeg-dev zlib1g-dev \
            imagemagick tesseract-ocr tesseract-ocr-eng libimage-exiftool-perl \
            python3-reportlab python3-pil python3-numpy \
            poppler-utils

      - name: Build desktop app
        run: qmake6 paperman.pro CONFIG+=test -o Makefile.qt6 && make -f Makefile.qt6 -j$(nproc)

      - name: Build server
        run: |
          qmake6 paperman-server.pro -o server.mk
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -f server.mk -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        run: QT_QPA_PLATFORM=offscreen ./paperman -t

      - name: Run page-fetch integration test
        run: scripts/test_page_fetch.sh

      - name: Run server smoke test
        run: scripts/test_server_smoke.sh

      - name: Run parallel conversion test
        run: scripts/test_parallel.sh

  windows:
    name: Windows (MSYS2 MinGW64, Qt6) desktop app + server + C++ tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-scxml
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-poppler-qt6
            mingw-w64-x86_64-podofo
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-ghostscript
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-tesseract-data-eng
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-reportlab
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-numpy

      - name: Build desktop app
        run: qmake6 paperman.pro CONFIG+=test -o Makefile.win && make -k -f Makefile.win -j$(nproc)

      - name: Build server
        run: |
          qmake6 paperman-server.pro -o server.mk
          echo '#define SERVER_BUILD_DATE "CI"' > builddate.h
          make -k -f server.mk -j$(nproc)

      - name: Generate test data
        run: python3 scripts/make_test_files.py

      - name: Run Qt unit tests
        # fail a hung test quickly rather than after QtTest's five minutes
        run: QT_QPA_PLATFORM=offscreen QTEST_FUNCTION_TIMEOUT=60000 ./paperman.exe -t

      # The tests are built with a console attached, so that their output
      # is not swallowed; what is shipped is built without one
      - name: Build the app to ship
        run: |
          make -f Makefile.win clean
          qmake6 paperman.pro -o Makefile.win
          make -f Makefile.win -j$(nproc)

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: scripts/win-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: paperman-windows-installer
          path: packaging/windows/paperman-setup-*.exe

  windows-arm64:
    name: Windows on Arm (MSYS2 CLANGARM64, Qt6) desktop app + installer
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            mingw-w64-clang-aarch64-cc
            mingw-w64-clang-aarch64-llvm-tools
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-qt6-base
            mingw-w64-clang-aarch64-qt6-scxml
            mingw-w64-clang-aarch64-qt6-svg
            mingw-w64-clang-aarch64-poppler-qt6
            mingw-w64-clang-aarch64-podofo
            mingw-w64-clang-aarch64-libtiff
            mingw-w64-clang-aarch64-libjpeg-turbo
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-poppler

      - name: Build the app
        run: qmake6 paperman.pro -o Makefile.win && make -f Makefile.win -j$(nproc)

      # the Arm image may not have Chocolatey, so fetch Inno Setup itself;
      # it is an x86 program, which Windows on Arm runs under emulation
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -OutFile $f `
             https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          Start-Process $f -Wait -ArgumentList `
             '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER'

      - name: Build the installer
        run: scripts/win-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: paperman-windows-arm64-installer
          path: packaging/windows/paperman-setup-*-arm64.exe

  macos:
    name: macOS ${{ matrix.arch }} desktop app + C++ tests + package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      POPPLER: '26.09.0'
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Poppler's command-line tools and Ghostscript are only for the
      # server tests; the library paperman uses is built below
      - name: Install the dependencies
        run: |
          brew install qt podofo libtiff jpeg-turbo libusb pkgconf cmake \
             ninja openjpeg little-cms2 fontconfig autoconf automake \
             libtool gettext autoconf-archive poppler ghostscript
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      # Homebrew's Poppler has no Qt bindings
      - uses: actions/cache@v4
        id: poppler
        with:
          path: ~/poppler
          key: poppler-qt6-${{ env.POPPLER }}-${{ matrix.arch }}

      - name: Build Poppler with its Qt bindings
        if: steps.poppler.outputs.cache-hit != 'true'
        run: |
          curl -sSLO https://poppler.freedesktop.org/poppler-$POPPLER.tar.xz
          tar xf poppler-$POPPLER.tar.xz
          cmake -S poppler-$POPPLER -B pbuild -G Ninja \
             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/poppler \
             -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix)" \
             -DENABLE_QT5=OFF -DENABLE_GLIB=OFF -DENABLE_NSS3=OFF \
             -DENABLE_GPGME=OFF -DENABLE_LIBCURL=OFF -DENABLE_BOOST=OFF \
             -DENABLE_HARFBUZZ=OFF -DBUILD_QT6_TESTS=OFF \
             -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
          ninja -C pbuild install

      # the SANE the package carries: Homebrew's does not know the fi-8950
      - name: Build SANE
        run: |
          git clone -q -b all-work https://gitlab.com/sjg20/backends.git sane
          cd sane
          ./autogen.sh
          ./configure --prefix=$HOME/sane BACKENDS="fujitsu finet" \
             --disable-locking --without-snmp --without-avahi \
             --disable-nls --without-usb-record-replay \
             CPPFLAGS=-I$(brew --prefix)/include LDFLAGS=-L$(brew --prefix)/lib
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build and run the tests
        run: |
          export PKG_CONFIG_PATH=$HOME/sane/lib/pkgconfig:$HOME/poppler/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig
          python3 -m pip install --break-system-packages -q reportlab pillow numpy
          qmake CONFIG+=test paperman.pro -o Makefile
          make -f Makefile -j$(sysctl -n hw.ncpu)
          python3 scripts/make_test_files.py
          QT_QPA_PLATFORM=offscreen QTEST_FUNCTION_TIMEOUT=60000 ./paperman -t

      # Signed with the Developer ID, and notarised, once the repository has
      # the secrets; see scripts/mac-sign-setup.sh. Otherwise ad hoc
      - name: Get ready to sign
        if: env.SIGN == 'true' && github.event_name == 'push'
        run: scripts/mac-sign-setup.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

      # The tests are built as a plain program; what is shipped is an
      # application bundle
      - name: Build the app and package it
        run: |
          export PKG_CONFIG_PATH=$HOME/sane/lib/pkgconfig:$HOME/poppler/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig
          make -f Makefile distclean
          qmake paperman.pro -o Makefile
          make -f Makefile -j$(sysctl -n hw.ncpu)
          SANE_PREFIX=$HOME/sane scripts/mac-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: paperman-macos-${{ matrix.arch }}
          path: dist/Paperman-*.dmg

  appimage:
    name: Linux ${{ matrix.arch }} AppImage
    runs-on: ${{ matrix.runner }}
    # built on the oldest Linux it is to run on, since it needs the C
    # library it was built with or a later one
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # libsane-dev brings the SANE which the AppImage is checked against
      - name: Install the dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential qmake6 qt6-base-dev qt6-base-dev-tools \
            libqt6sql6-sqlite qt6-scxml-dev libqt6statemachine6 qt6-svg-dev \
            qt6-gtk-platformtheme libpoppler-qt6-dev libpodofo-dev libtiff-dev libsane-dev \
            libjpeg-dev zlib1g-dev pkg-config file curl

      - name: Build the app and the AppImage
        run: scripts/appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: paperman-appimage-${{ matrix.arch }}
          path: dist/Paperman-*.AppImage

  snap:
    name: Linux ${{ matrix.arch }} snap
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # snapcraft builds in an LXD container, for the runner's architecture
      - uses: snapcore/action-build@v1
        id: snap

      - uses: actions/upload-artifact@v4
        with:
          name: paperman-snap-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}

  flutter:
    name: Flutter app + widget tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable

      - name: Generate demo assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-reportlab python3-pil python3-numpy poppler-utils
          python3 app/tools/gen_demo_assets.py

      - name: Analyse
        run: cd app && flutter analyze

      - name: Run widget tests
        run: cd app && flutter test

      - name: Set up dart-defines
        run: |
          APP_VERSION=$(sed -n 's/.*CONFIG_version_str "\(.*\)"/\1.0/p' config.h)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "{\"BUILD_DATE\":\"$(date '+%a %d %b %H:%M:%S %Z %Y')\"}" > app/dart-defines.json

      - name: Build release APK
        run: |
          cd app && flutter build apk \
            --build-name="$APP_VERSION" \
            --dart-define-from-file=dart-defines.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Linux desktop app
        run: |
          cd app && flutter build linux \
            --build-name="$APP_VERSION" \
            --dart-define-from-file=dart-defines.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperman-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
