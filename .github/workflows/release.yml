name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-deb:
    name: Build .deb and create GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake debhelper devscripts fakeroot \
            qt5-qmake qtbase5-dev qtbase5-dev-tools libqt5sql5-sqlite \
            libpoppler-qt5-dev libpodofo-dev \
            libtiff-dev libsane-dev libjpeg-dev zlib1g-dev \
            imagemagick tesseract-ocr tesseract-ocr-eng

      - name: Prepare debian packaging files
        run: |
          sed -e 's/VENDOR_VERSION//' \
              -e 's/UNRELEASED/noble/' \
              debian/changelog.in > debian/changelog
          cp debian/control.in debian/control
          cp debian/rules.in debian/rules
          chmod a+x debian/rules

      - name: Build binary .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release
        run: |
          DEB=$(ls ../paperman_*.deb | head -1)
          gh release create "$GITHUB_REF_NAME" "$DEB" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    name: Build the Windows ${{ matrix.arch }} installer and add it to the release
    runs-on: ${{ matrix.runner }}
    needs: build-deb
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: MINGW64
            pkg: mingw-w64-x86_64
          # native, rather than the x64 one under emulation
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg: mingw-w64-clang-aarch64
    defaults:
      run:
        shell: msys2 {0}
    # Signing is done by SignPath once the repository has the variable
    # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN; until
    # then the installer is built unsigned. See doc/code-signing.rst
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.pkg }}-cc
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-qt6-base
            ${{ matrix.pkg }}-qt6-scxml
            ${{ matrix.pkg }}-poppler-qt6
            ${{ matrix.pkg }}-podofo
            ${{ matrix.pkg }}-libtiff
            ${{ matrix.pkg }}-libjpeg-turbo
            ${{ matrix.pkg }}-zlib
            ${{ matrix.pkg }}-poppler

      # the Clang toolchain keeps objdump and strip here
      - name: Install the LLVM tools
        if: matrix.arch == 'arm64'
        run: pacman -S --noconfirm ${{ matrix.pkg }}-llvm-tools

      - name: Build the app
        run: qmake6 paperman.pro -o Makefile.win && make -f Makefile.win -j$(nproc)

      - name: Gather what it needs
        run: scripts/win-stage.sh

      # the four-part version Windows shows, which signing checks
      - name: Find the version
        id: version
        run: echo "version=$(sed -n 's/.*CONFIG_version_str "\(.*\)".*/\1/p' config.h).0" >> $GITHUB_OUTPUT

      - name: Upload the program to be signed
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ matrix.arch }}
          path: dist/paperman/bin/paperman.exe

      # someone has to approve each request in SignPath, so allow an hour
      - name: Sign the program
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'paperman' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: paperman-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe

      - name: Put the signed program in place
        if: env.SIGN == 'true'
        run: cp signed-exe/paperman.exe dist/paperman/bin/paperman.exe

      # fetch it rather than use Chocolatey, which the Arm image may lack;
      # it is an x86 program, which Windows on Arm runs under emulation
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -OutFile $f `
             https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          Start-Process $f -Wait -ArgumentList `
             '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER'

      - name: Build the installer
        run: scripts/win-installer.sh --staged

      - name: Upload the installer to be signed
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: packaging/windows/paperman-setup-*.exe

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'paperman' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Put the signed installer in place
        if: env.SIGN == 'true'
        run: cp signed-installer/paperman-setup-*.exe packaging/windows/

      - name: Add it to the release
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME (Get-Item packaging/windows/paperman-setup-*.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ppa-upload:
    name: Sign and upload to Launchpad PPA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            debhelper devscripts dput fakeroot bzip2

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure gpg-agent for non-interactive signing
        run: |
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          KEYGRIP=$(gpg --list-secret-keys --with-keygrip \
            | sed -n 's/.*Keygrip = \(.*\)/\1/p' | head -1)
          gpg-connect-agent "PRESET_PASSPHRASE $KEYGRIP -1 \
            $(echo -n "$GPG_PASSPHRASE" | xxd -p -c 256)" /bye
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure dput
        run: |
          cat > ~/.dput.cf <<'EOF'
          [ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~sjg20/ubuntu/ppa/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

      - name: Upload to PPA
        run: scripts/ppa-upload
